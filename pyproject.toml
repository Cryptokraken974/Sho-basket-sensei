[project]
name = "basketvision-coach"
version = "0.1.0"
description = "BasketVision Coach: a testable scaffold for basketball shot feedback from vision measurements."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "BasketVision Coach Maintainers" }]
license = { text = "MIT" }
keywords = ["basketball", "computer-vision", "coaching", "sports-analytics"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
basketvision-coach = "basketvision_coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basketvision_coach"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

# Optional CV runtime (installed separately; not a declared dependency).
[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
